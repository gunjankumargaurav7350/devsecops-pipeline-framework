# Azure DevOps Multi-Stage DevSecOps Pipeline
trigger:
  branches:
    include:
      - main
      - releases/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'sc-azure-landing-zone-spn'
  terraformVersion: '1.7.5'

stages:
- stage: QualityAndSecurity
  displayName: 'Quality, Security & Compliance'
  jobs:
  - job: SecurityGates
    displayName: 'Shift-Left Security & Secrets'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
    - script: |
        pip install checkov
        checkov -d . --framework terraform --compact
      displayName: 'Execute Checkov IaC Security'
    - script: |
        curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        trivy config . --severity HIGH,CRITICAL
      displayName: 'Execute Trivy IaC & Container Vulnerability Scan'

- stage: TerraformPlan
  displayName: 'Terraform Plan & Cost Estimation'
  dependsOn: QualityAndSecurity
  jobs:
  - job: Plan
    steps:
    - script: |
        echo "Validating remote state in Azure Storage..."
        echo "Generating speculative plan artifact..."
      displayName: 'Terraform Plan'

- stage: DeployToProduction
  displayName: 'Deploy to Production (Gated)'
  dependsOn: TerraformPlan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: Deploy
    environment: 'production-cloud-landing-zone'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: echo "Applying infrastructure with zero-downtime rollback guarantees..."
